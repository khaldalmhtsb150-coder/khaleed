<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>السيرفرات — MarkaBot</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/theme.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('mk-theme')||'night'}catch(e){}</script>
</head>
<body>
  <main class="container">
    <div class="page-head">
      <div>
        <h1>السيرفرات</h1>
        <p>السيرفرات اللي عندك فيها صلاحية «إدارة السيرفر» أو «المسؤول».</p>
      </div>
      <div style="display:flex;gap:8px">
        <input class="input" id="q" type="search" placeholder="ابحث عن سيرفر" style="width:240px" aria-label="بحث">
        <button class="btn ghost" id="refresh">تحديث</button>
      </div>
    </div>
    <div id="list">
      <div class="servers"><div class="skeleton" style="height:64px"></div><div class="skeleton" style="height:64px"></div><div class="skeleton" style="height:64px"></div><div class="skeleton" style="height:64px"></div></div>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script>
    let all = [];
    const list = document.getElementById('list');
    function render() {
      const q = document.getElementById('q').value.trim().toLowerCase();
      const items = all.filter((g) => !q || g.name.toLowerCase().includes(q));
      const withBot = items.filter((g) => g.hasBot);
      const without = items.filter((g) => !g.hasBot);
      const group = (title, arr) => (arr.length ? `<div class="srv-group">${title} · ${MB.num(arr.length)}</div><div class="servers">${arr.map(MB.serverRow).join('')}</div>` : '');
      list.innerHTML = items.length
        ? group('البوت مضاف', withBot) + group('بدون البوت', without)
        : '<div class="empty">ما في نتائج.</div>';
    }
    async function load(refresh) {
      try {
        all = await MB.api(`/api/guilds${refresh ? '?refresh=1' : ''}`);
        render();
        if (refresh) MB.toast('انحدّثت قائمة السيرفرات', 'success');
      } catch (e) { MB.toast(e.message, 'error'); }
    }
    MB.topbar({ active: 'servers' });
    load(false);
    q.addEventListener('input', render);
    refresh.onclick = () => load(true);
  </script>
</body>
</html>
